[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-alerts"
version = "0.1.0"
description = "Workshop demo: enriching observability alerts with RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "numpy",
    "openai",
    "prometheus-client",
    "python-dotenv",
    "qdrant-client",
    "sentence-transformers",
    "typer",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
